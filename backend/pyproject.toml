[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssu-lms-bridge-backend"
version = "0.1.0"
description = "숭실대 LMS Bridge — FastAPI 백엔드"
requires-python = ">=3.11"
dependencies = [
    # 스크래핑
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    # HTTP
    "httpx>=0.27.0",
    # 웹 서버
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # WebSocket
    "websockets>=12.0",
    # LLM 멀티 프로바이더
    "litellm>=1.40.0",
    # 설정 관리
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # 스케줄러
    "apscheduler>=3.10.4",
    # 로깅
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
