[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssu-lms-bridge-backend"
version = "0.1.0"
description = "숭실대 LMS Bridge — FastAPI 백엔드"
requires-python = ">=3.11"
dependencies = [
    # 스크래핑
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    # HTTP
    "httpx>=0.27.0",
    # 웹 서버
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # WebSocket
    "websockets>=12.0",
    # LLM 멀티 프로바이더
    "litellm>=1.40.0",
    # 설정 관리
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # 스케줄러
    "apscheduler>=3.10.4",
    # 로깅
    "loguru>=0.7.2",
    # MCP (Model Context Protocol) — Notion / Obsidian 연동
    "mcp>=1.0.0",
    # Notion API 클라이언트 (MCP Notion 서버에서 사용)
    # ⚠️ 3.0+ 는 Notion 2025-09 API(data_sources 모델)로 바뀌며 databases.query 를
    #    제거해 mcp_client/notion_server.py(2.x API 가정)가 깨진다 — 2.x 로 핀.
    "notion-client>=2.2.1,<3",
    # 강의자료 RAG MCP(materials_server) 본문 텍스트 추출 — PDF/PPTX/DOCX
    "pypdf>=4.0.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
